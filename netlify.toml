[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/lib/days.json"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/course.js"
  [headers.values]
    Cache-Control = "no-cache"

# Scheduled jobs (times are UTC; Tashkent = UTC+5)
[functions."cron-morning"]
  schedule = "0 3 * * *"

[functions."cron-evening"]
  schedule = "0 14 * * *"

