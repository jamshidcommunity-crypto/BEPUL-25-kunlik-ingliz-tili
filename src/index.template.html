<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beginner 25 — Imamov Academy</title>
<meta name="description" content="25 kunlik bepul ingliz tili kursi: grammatika, mashqlar va shadowing. Imamov Academy.">
<meta name="theme-color" content="#0B3FAF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beginner 25">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#0B3FAF; --sky:#1E9BE6; --ink:#13203D; --muted:#5B6B8A; --paper:#EEF2F8; --card:#FFFFFF; --line:#D9E1EF;
  --tint:#E6F0FC; --ok:#16A34A; --bad:#DC2626; --okbg:#E8F7EE; --badbg:#FDECEC; --gold:#D98B0C;
  --radius:18px; --shadow:0 4px 18px rgba(11,63,175,.08); --shadow2:0 10px 30px rgba(11,63,175,.16);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --royal:#3D8FE8; --ink:#E8EEF9; --muted:#A3B1CC; --paper:#0B1530; --card:#13204A; --line:#25366B; --tint:#1A2B5C; --okbg:#0F3A22; --badbg:#4A1515; --shadow:0 4px 18px rgba(0,0,0,.35); --shadow2:0 10px 30px rgba(0,0,0,.45);} }
:root[data-theme="dark"]{ --royal:#3D8FE8; --ink:#E8EEF9; --muted:#A3B1CC; --paper:#0B1530; --card:#13204A; --line:#25366B; --tint:#1A2B5C; --okbg:#0F3A22; --badbg:#4A1515; --shadow:0 4px 18px rgba(0,0,0,.35); --shadow2:0 10px 30px rgba(0,0,0,.45);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden;position:relative;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
a{color:var(--royal)}
.wing{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wing svg{position:absolute;width:140vw;height:auto;opacity:.10}
.wing .a{top:-30vw;left:-55vw;transform:rotate(-8deg)}
.wing .b{bottom:-40vw;right:-60vw;transform:rotate(172deg)}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:var(--sat) 16px calc(48px + var(--sab))}
.view{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px;position:sticky;top:0;background:var(--paper);z-index:5}
.top img{height:40px;width:auto}
.top .brand{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--royal);line-height:1.1}
.top .brand small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--royal);font-weight:600;padding:8px 10px;border-radius:10px;margin-left:-10px}
.back:hover{background:var(--tint)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tint);color:var(--royal);font-size:18px}
.curve{height:14px;margin:0 -16px 10px;background:radial-gradient(120% 100% at 50% -80%, var(--sky) 0 0, transparent 70%) no-repeat;opacity:.9}
/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:170px;height:170px;background:url("data:image/png;base64,__EMBLEM__") no-repeat center/contain;opacity:.07;pointer-events:none}
.hero .arc{position:relative;width:132px;height:132px}
.hero .arc svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero .arc .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-weight:700;color:var(--royal);line-height:1}
.hero .arc .n small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.hero h1{font-size:26px;color:var(--royal)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;background:var(--tint);color:var(--royal);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.days{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.days{grid-template-columns:1fr 1fr}} @media(min-width:980px){.days{grid-template-columns:1fr 1fr 1fr}}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;width:100%;border:2px solid transparent;transition:border-color .15s,transform .15s}
.day:hover{border-color:var(--sky)} .day:active{transform:scale(.99)} .day:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.day .num{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;box-shadow:0 4px 12px rgba(11,63,175,.25)}
.day.locked .num{background:var(--line);color:var(--muted);box-shadow:none} .day.locked{opacity:.65}
.day.done .num{background:linear-gradient(135deg,#22C55E,#15803D)}
.day.part .num{background:linear-gradient(135deg,#F2B134,var(--gold))}
.day .t{display:block;font-weight:600;font-size:15px;line-height:1.3} .day .s{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.day .mini{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden} .day .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--royal))}
.day .st{font-size:18px;color:var(--muted)}
.day.next{border-color:var(--sky);box-shadow:var(--shadow2)}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;width:100%;border:2px solid transparent}
.unit:hover{border-color:var(--sky)}
.unit .k{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--tint);color:var(--royal)}
.unit .k.S{background:#FFF1DB;color:var(--gold)} .unit .k.sh{background:#E9F8EF;color:var(--ok)}
.unit .t{display:block;font-weight:600;line-height:1.3} .unit .s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.score{font-weight:700;color:var(--royal);font-size:14px;white-space:nowrap} .score.ok{color:var(--ok)}
h2.sec{font-size:22px;color:var(--royal);margin:6px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
/* steps / tabs */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px;position:sticky;top:calc(62px + var(--sat));z-index:4}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button b{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tabs button.seen b{background:var(--okbg);color:var(--ok)} .tabs button.on{background:var(--royal);color:#fff} .tabs button.on b{background:rgba(255,255,255,.25);color:#fff}
@media(max-width:400px){.tabs button{font-size:13px}.tabs button b{display:none}}
.rule{font-size:16px;line-height:1.65} .rule em{font-style:italic;color:var(--royal);font-weight:600}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .en{flex:1;font-size:17px}
.spk{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--royal);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk:hover{background:var(--sky);color:#fff} .spk.on{background:var(--royal);color:#fff}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(min-width:600px){.words{grid-template-columns:1fr 1fr 1fr 1fr}}
.word{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid transparent;position:relative}
.word .en{font-weight:600;font-size:17px;color:var(--royal)} .word .uz{color:var(--muted);font-size:14px;margin-top:4px;min-height:21px}
.word .uz.hide{visibility:hidden} .word .spk{position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:13px}
.text{font-family:var(--serif);font-size:19px;line-height:1.75}
.text .w{cursor:pointer;border-bottom:1.5px dotted transparent;border-radius:3px;padding:0 1px}
.text .w:hover,.text .w.on{border-bottom-color:var(--sky);background:var(--tint)}
.text .spkr{font-family:var(--sans);font-weight:600;color:var(--royal)}
.pop{position:absolute;z-index:20;background:var(--royal);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(11,63,175,.3);font-family:var(--sans);font-size:14px;max-width:260px}
.pop b{font-size:16px;display:block;margin-bottom:2px}
.pop .ph{opacity:.85;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;box-shadow:0 4px 14px rgba(11,63,175,.25);transition:transform .1s}
.btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--tint);color:var(--royal);box-shadow:none}
.btn.wide{width:100%}
/* exercises */
.exs h3{font-size:17px;margin:18px 0 8px;color:var(--royal)}
.exs h3 small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.q{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border-left:4px solid transparent}
.q.right{border-left-color:var(--ok)} .q.wrong{border-left-color:var(--bad)}
.q .qq{font-size:17px;margin-bottom:10px} .q .qq .n{color:var(--muted);font-size:13px;margin-right:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:10px;background:var(--tint);color:var(--royal);font-weight:600;border:2px solid transparent}
.opt:hover{border-color:var(--sky)} .opt.pick{background:var(--royal);color:#fff}
.opt.good{background:var(--okbg);color:var(--ok);border-color:var(--ok)} .opt.badp{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default}
.build{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-family:var(--serif);font-size:18px}
.build .ph{color:var(--muted);font-family:var(--sans);font-size:13px}
.chip{padding:6px 12px;border-radius:9px;background:var(--tint);color:var(--royal);font-weight:600;border:2px solid transparent}
.chip.in{background:var(--royal);color:#fff} .chip.used{opacity:.25;pointer-events:none}
.fillrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillrow input{flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:16px}
.fillrow input:focus{outline:none;border-color:var(--sky)}
.fb{margin-top:8px;font-size:14px;font-weight:600} .fb.good{color:var(--ok)} .fb.badp{color:var(--bad)}
.fb .key{font-weight:500;color:var(--muted)}
.progressbar{position:sticky;bottom:calc(10px + var(--sab));z-index:3;background:var(--card);border-radius:999px;box-shadow:var(--shadow2);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:14px}
.progressbar .bar{flex:1;margin:0}
.result{background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;border-radius:var(--radius);padding:22px;text-align:center;margin-top:16px;position:relative;overflow:hidden}
.result .big{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
.result p{margin:8px 0 14px;opacity:.95}
.result .btn{background:#fff;color:var(--royal)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* shadowing */
.stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stage{padding:12px 8px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:center;border:2px solid transparent}
.stage b{display:block;font-family:var(--serif);font-size:20px;color:var(--royal)} .stage small{color:var(--muted);font-size:12px}
.stage.on{border-color:var(--royal)} .stage.ok{border-color:var(--ok)} .stage:disabled{opacity:.45}
.shline{font-family:var(--serif);font-size:30px;line-height:1.3;color:var(--ink);text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;padding:10px}
.shuz{text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.shmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--royal));width:0;transition:width .3s}
.shlist{margin-top:14px;display:grid;gap:6px}
.shlist .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:15px}
.shlist .it .i{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--royal);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.shlist .it.on{outline:2px solid var(--sky)}
.shlist .it .uz{color:var(--muted);font-size:13px}
/* login */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto}
.login .logo{text-align:center;margin-bottom:18px} .login .logo img{height:120px} .login .logo h1{font-size:30px;color:var(--royal);margin-top:6px} .login .logo p{color:var(--muted);margin:4px 0 0;font-size:14px}
.codein{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:22px;text-align:center;letter-spacing:.12em;font-weight:700;text-transform:uppercase;font-family:var(--sans)}
.codein:focus{outline:none;border-color:var(--sky)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px;margin:8px 0;text-align:center}
.steps{display:grid;gap:8px;margin:14px 0}
.steps>div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)} .steps>div>b{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--royal);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none} .steps span b{color:var(--ink)}
/* install */
.install{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.install .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:22px}
.install .t{display:block;font-weight:600} .install .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ios{font-size:14px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ios b{color:var(--royal)}
/* misc */
.note{font-size:13px;color:var(--muted);margin:10px 0}
.form label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.form input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:16px}
.form input:focus{outline:none;border-color:var(--sky)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.foot img{height:22px;opacity:.9;display:block;margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hidden{display:none !important}
.kbd{font-size:12px;color:var(--muted)}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat div{background:var(--tint);border-radius:12px;padding:10px;text-align:center} .stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--royal)} .stat small{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media(max-width:420px){.hero{grid-template-columns:104px 1fr}.hero .arc{width:104px;height:104px}.hero .arc .n{font-size:24px}.hero h1{font-size:22px}.shline{font-size:24px}}
</style>
</head>
<body>
<div class="wing" aria-hidden="true">
  <svg class="a" viewBox="0 0 1000 420"><path d="M0,420 C250,60 700,-40 1000,160 L1000,0 L0,0 Z" fill="#0B3FAF"/><path d="M0,420 C280,120 720,40 1000,230" stroke="#1E9BE6" stroke-width="6" fill="none"/></svg>
  <svg class="b" viewBox="0 0 1000 420"><path d="M0,420 C250,60 700,-40 1000,160 L1000,0 L0,0 Z" fill="#0B3FAF"/><path d="M0,420 C280,120 720,40 1000,230" stroke="#1E9BE6" stroke-width="6" fill="none"/></svg>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="course.js"></script>
<script>
__APP__
</script>
</body>
</html>
