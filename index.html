<style>
:root{
  --royal:#0B3FAF; --sky:#1E9BE6; --ink:#13203D; --muted:#5B6B8A; --paper:#EEF2F8; --card:#FFFFFF; --line:#D9E1EF;
  --tint:#E6F0FC; --ok:#16A34A; --bad:#DC2626; --okbg:#E8F7EE; --badbg:#FDECEC; --gold:#D98B0C;
  --radius:18px; --shadow:0 4px 18px rgba(11,63,175,.08); --shadow2:0 10px 30px rgba(11,63,175,.16);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --royal:#3D8FE8; --ink:#E8EEF9; --muted:#A3B1CC; --paper:#0B1530; --card:#13204A; --line:#25366B; --tint:#1A2B5C; --okbg:#0F3A22; --badbg:#4A1515; --shadow:0 4px 18px rgba(0,0,0,.35); --shadow2:0 10px 30px rgba(0,0,0,.45);} }
:root[data-theme="dark"]{ --royal:#3D8FE8; --ink:#E8EEF9; --muted:#A3B1CC; --paper:#0B1530; --card:#13204A; --line:#25366B; --tint:#1A2B5C; --okbg:#0F3A22; --badbg:#4A1515; --shadow:0 4px 18px rgba(0,0,0,.35); --shadow2:0 10px 30px rgba(0,0,0,.45);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden;position:relative;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
a{color:var(--royal)}
.wing{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wing svg{position:absolute;width:140vw;height:auto;opacity:.10}
.wing .a{top:-30vw;left:-55vw;transform:rotate(-8deg)}
.wing .b{bottom:-40vw;right:-60vw;transform:rotate(172deg)}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:var(--sat) 16px calc(48px + var(--sab))}
.view{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#FFFFFF 0%,#E6F0FB 45%,#CFE3F9 100%);transition:opacity .45s ease}
#splash.off{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;left:-30vw;right:-30vw;bottom:-55vw;height:90vw;border-radius:50%;background:radial-gradient(closest-side,rgba(30,155,230,.22),rgba(30,155,230,0))}
#splash img{width:42vw;max-width:220px;height:auto;animation:spl .7s cubic-bezier(.2,1.4,.4,1)}
#splash .t{position:absolute;bottom:calc(60px + var(--sab));left:0;right:0;text-align:center;font-family:var(--serif);font-weight:600;font-size:22px;color:#0B3FAF;opacity:.9}
#splash .t small{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:#4A5A7A;margin-top:4px;letter-spacing:1.5px}
@keyframes spl{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #splash{background:linear-gradient(160deg,#13204A 0%,#0B1530 100%)} :root:not([data-theme="light"]) #splash .t{color:#9ED4F7}}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px;position:sticky;top:0;background:var(--paper);z-index:5}
.top img{height:40px;width:auto}
.top .brand{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--royal);line-height:1.1}
.top .brand small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--royal);font-weight:600;padding:8px 10px;border-radius:10px;margin-left:-10px}
.back:hover{background:var(--tint)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--tint);color:var(--royal);font-size:18px}
.curve{height:14px;margin:0 -16px 10px;background:radial-gradient(120% 100% at 50% -80%, var(--sky) 0 0, transparent 70%) no-repeat;opacity:.9}
/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}

.hero .arc{position:relative;width:132px;height:132px}
.hero .arc svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero .arc .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-weight:700;color:var(--royal);line-height:1}
.hero .arc .n small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.hero h1{font-size:26px;color:var(--royal)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-block;background:var(--tint);color:var(--royal);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.days{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.days{grid-template-columns:1fr 1fr}} @media(min-width:980px){.days{grid-template-columns:1fr 1fr 1fr}}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;width:100%;border:2px solid transparent;transition:border-color .15s,transform .15s}
.day:hover{border-color:var(--sky)} .day:active{transform:scale(.99)} .day:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.day .num{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;box-shadow:0 4px 12px rgba(11,63,175,.25)}
.day.locked .num{background:var(--line);color:var(--muted);box-shadow:none} .day.locked{opacity:.65}
.day.done .num{background:linear-gradient(135deg,#22C55E,#15803D)}
.day.part .num{background:linear-gradient(135deg,#F2B134,var(--gold))}
.day .t{display:block;font-weight:600;font-size:15px;line-height:1.3} .day .s{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.day .mini{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden} .day .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--royal))}
.day .st{font-size:18px;color:var(--muted)}
.day.next{border-color:var(--sky);box-shadow:var(--shadow2)}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;width:100%;border:2px solid transparent}
.unit:hover{border-color:var(--sky)}
.unit .k{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--tint);color:var(--royal)}
.unit .k.S{background:#FFF1DB;color:var(--gold)} .unit .k.sh{background:#E9F8EF;color:var(--ok)}
.unit .t{display:block;font-weight:600;line-height:1.3} .unit .s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.score{font-weight:700;color:var(--royal);font-size:14px;white-space:nowrap} .score.ok{color:var(--ok)}
h2.sec{font-size:22px;color:var(--royal);margin:6px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
/* steps / tabs */
.tabs{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px;position:sticky;top:calc(62px + var(--sat));z-index:4}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button b{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tabs button.seen b{background:var(--okbg);color:var(--ok)} .tabs button.on{background:var(--royal);color:#fff} .tabs button.on b{background:rgba(255,255,255,.25);color:#fff}
@media(max-width:400px){.tabs button{font-size:13px}.tabs button b{display:none}}
.rule{font-size:16px;line-height:1.65} .rule em{font-style:italic;color:var(--royal);font-weight:600}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .en{flex:1;font-size:17px}
.spk{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--royal);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk:hover{background:var(--sky);color:#fff} .spk.on{background:var(--royal);color:#fff}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(min-width:600px){.words{grid-template-columns:1fr 1fr 1fr 1fr}}
.word{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid transparent;position:relative}
.word .en{font-weight:600;font-size:17px;color:var(--royal)} .word .uz{color:var(--muted);font-size:14px;margin-top:4px;min-height:21px}
.word .uz.hide{visibility:hidden} .word .spk{position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:13px}
.text{font-family:var(--serif);font-size:19px;line-height:1.75}
.text .w{cursor:pointer;border-bottom:1.5px dotted transparent;border-radius:3px;padding:0 1px}
.text .w:hover,.text .w.on{border-bottom-color:var(--sky);background:var(--tint)}
.text .spkr{font-family:var(--sans);font-weight:600;color:var(--royal)}
.pop{position:absolute;z-index:20;background:var(--royal);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(11,63,175,.3);font-family:var(--sans);font-size:14px;max-width:260px}
.pop b{font-size:16px;display:block;margin-bottom:2px}
.pop .ph{opacity:.85;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;box-shadow:0 4px 14px rgba(11,63,175,.25);transition:transform .1s}
.btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--tint);color:var(--royal);box-shadow:none}
.btn.wide{width:100%}
/* exercises */
.exs h3{font-size:17px;margin:18px 0 8px;color:var(--royal)}
.exs h3 small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.q{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border-left:4px solid transparent}
.q.right{border-left-color:var(--ok)} .q.wrong{border-left-color:var(--bad)}
.q .qq{font-size:17px;margin-bottom:10px} .q .qq .n{color:var(--muted);font-size:13px;margin-right:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:10px;background:var(--tint);color:var(--royal);font-weight:600;border:2px solid transparent}
.opt:hover{border-color:var(--sky)} .opt.pick{background:var(--royal);color:#fff}
.opt.good{background:var(--okbg);color:var(--ok);border-color:var(--ok)} .opt.badp{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default}
.build{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-family:var(--serif);font-size:18px}
.build .ph{color:var(--muted);font-family:var(--sans);font-size:13px}
.chip{padding:6px 12px;border-radius:9px;background:var(--tint);color:var(--royal);font-weight:600;border:2px solid transparent}
.chip.in{background:var(--royal);color:#fff} .chip.used{opacity:.25;pointer-events:none}
.fillrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillrow input{flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:16px}
.fillrow input:focus{outline:none;border-color:var(--sky)}
.fb{margin-top:8px;font-size:14px;font-weight:600} .fb.good{color:var(--ok)} .fb.badp{color:var(--bad)}
.fb .key{font-weight:500;color:var(--muted)}
.progressbar{position:sticky;bottom:calc(10px + var(--sab));z-index:3;background:var(--card);border-radius:999px;box-shadow:var(--shadow2);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:14px}
.progressbar .bar{flex:1;margin:0}
.result{background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;border-radius:var(--radius);padding:22px;text-align:center;margin-top:16px;position:relative;overflow:hidden}
.result .big{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
.result p{margin:8px 0 14px;opacity:.95}
.result .btn{background:#fff;color:var(--royal)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* shadowing */
.stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stage{padding:12px 8px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:center;border:2px solid transparent}
.stage b{display:block;font-family:var(--serif);font-size:20px;color:var(--royal)} .stage small{color:var(--muted);font-size:12px}
.stage.on{border-color:var(--royal)} .stage.ok{border-color:var(--ok)} .stage:disabled{opacity:.45}
.shline{font-family:var(--serif);font-size:30px;line-height:1.3;color:var(--ink);text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;padding:10px}
.shuz{text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.shmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--royal));width:0;transition:width .3s}
.bar.mic{height:10px;background:#FFF1DB} .bar.mic i{background:linear-gradient(90deg,#F2B134,var(--gold));transition:none}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px} .seg button{padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)} .seg button.on{background:var(--royal);color:#fff}
.shlist{margin-top:14px;display:grid;gap:6px}
.shlist .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:15px}
.shlist .it .i{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--royal);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.shlist .it.on{outline:2px solid var(--sky)}
.shlist .it .uz{color:var(--muted);font-size:13px}
/* login */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto}
.login .logo{text-align:center;margin-bottom:18px} .login .logo img{height:120px} .login .logo h1{font-size:30px;color:var(--royal);margin-top:6px} .login .logo p{color:var(--muted);margin:4px 0 0;font-size:14px}
.codein{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:22px;text-align:center;letter-spacing:.12em;font-weight:700;text-transform:uppercase;font-family:var(--sans)}
.codein:focus{outline:none;border-color:var(--sky)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px;margin:8px 0;text-align:center}
.steps{display:grid;gap:8px;margin:14px 0}
.steps>div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)} .steps>div>b{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--royal);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none} .steps span b{color:var(--ink)}
/* install */
.install{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.install .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:22px}
.install .t{display:block;font-weight:600} .install .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ios{font-size:14px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ios b{color:var(--royal)}
/* misc */
.note{font-size:13px;color:var(--muted);margin:10px 0}
.form label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.form input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:16px}
.form input:focus{outline:none;border-color:var(--sky)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.foot img{height:22px;opacity:.9;display:block;margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hidden{display:none !important}
.kbd{font-size:12px;color:var(--muted)}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat div{background:var(--tint);border-radius:12px;padding:10px;text-align:center} .stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--royal)} .stat small{color:var(--muted);font-size:12px}

/* ustoz */
.uhero{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;margin-bottom:14px;box-shadow:var(--shadow2)}
.uhero img{width:100%;height:360px;object-fit:cover;object-position:center 20%;display:block}
.uhero.sm img{height:230px;object-position:center 15%} .uhero.sm h1{font-size:24px} .uhero.sm .cap{padding:12px 16px 14px}
.gocard{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--sky)} .gocard .btn{white-space:nowrap;flex:none} .gocard b{display:block;font-family:var(--serif);font-size:20px;color:var(--royal)} .gocard small{color:var(--muted);font-size:13px}
.uhero .cap{padding:16px 18px 18px}
.uhero .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:1.5px}
.uhero h1{font-size:30px;margin-top:8px;color:#fff}
.uhero p{margin:4px 0 0;opacity:.92;font-size:14px}
.ustats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ustats div{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center}
.ustats b{display:block;font-family:var(--serif);font-size:24px;color:var(--royal);line-height:1.1}
.ustats small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.ustory{font-size:16px;line-height:1.65}
.ustory p{margin:0 0 12px} .ustory p:last-child{margin:0}
.ustory a{color:var(--royal);font-weight:600;text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:3px}
.ustory .lead{font-size:17px;font-weight:600;color:var(--royal)}
.ugal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ugal figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.ugal img{width:100%;height:150px;object-fit:cover;display:block}
.ugal figcaption{font-size:12px;color:var(--muted);padding:6px 10px}
.ugal figure.wide{grid-column:1/-1} .ugal figure.wide img{height:220px}
@media(min-width:720px){.ugal{grid-template-columns:1fr 1fr 1fr}.ugal figure.wide img{height:300px}.uhero img{height:460px}.uhero.sm img{height:300px}}
.ucta{position:sticky;bottom:calc(10px + var(--sab));z-index:3;display:flex;gap:8px;margin-top:6px}
.ucta .btn{flex:1}

/* extras */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:720px){.quick{grid-template-columns:repeat(4,1fr)}}
.qc{position:relative;display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;border:2px solid transparent}
.qc:hover{border-color:var(--sky)} .qc .qi{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.qc b{display:block;font-size:14px} .qc small{display:block;font-size:12px;color:var(--muted)}
.qc em{position:absolute;top:-6px;right:-6px;background:#DC2626;color:#fff;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(7,20,60,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.mbox{background:var(--card);border-radius:24px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox .bicon{font-size:72px;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)} .mbox .mt{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--sky);margin-top:8px}
.mbox h2{font-size:26px;color:var(--royal);margin-top:4px} .mbox p{color:var(--muted);margin:6px 0 0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(min-width:600px){.badges{grid-template-columns:repeat(3,1fr)}}
.bd{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:center;opacity:.55}
.bd.has{opacity:1;border:2px solid var(--sky)} .bd .bi{font-size:38px} .bd b{display:block;margin-top:4px;font-size:14px} .bd small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mistakes h3{font-size:16px;color:var(--bad);margin:0 0 8px} .mk{padding:8px 0;border-top:1px solid var(--line);font-size:15px} .mk:first-of-type{border-top:0} .mk .ma{color:var(--ok);font-weight:700;margin-top:2px}
.rv{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px} .rvw{font-family:var(--serif);font-size:38px;color:var(--royal);font-weight:700}
.rvopts{display:grid;gap:10px} .rvopts .opt{padding:14px;font-size:17px;text-align:left}
.lbme{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px} .lbme small{display:block;font-size:12px;color:var(--muted)} .lbme b{font-family:var(--serif);font-size:28px;color:var(--royal)}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)} .lbr:first-child{border-top:0} .lbr.me{background:var(--tint);border-radius:10px;padding:10px}
.lbn{width:30px;text-align:center;font-weight:800;color:var(--muted)} .lbname{flex:1;font-weight:600} .lbs{font-size:12px;color:var(--muted)} .lbr b{font-family:var(--serif);font-size:18px;color:var(--royal);min-width:48px;text-align:right}
.certs{display:flex;flex-wrap:wrap;gap:8px} .cert{padding:8px 12px;border-radius:12px;background:var(--paper);color:var(--muted);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center} .cert.ok{background:var(--tint);color:var(--royal)}
.ph3{font-size:16px;color:var(--royal);margin:0 0 8px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px} .setrow:first-of-type{border-top:0}
.text .ra{background:#FFE58A !important;border-radius:4px;box-shadow:0 0 0 2px #FFE58A}
.search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px;margin-bottom:12px} .search:focus{outline:none;border-color:var(--sky)}
.dict{display:grid;gap:6px} .dw{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px}
.dw>div{flex:1} .dw b{display:block;color:var(--royal)} .dw span{font-size:14px;color:var(--muted)} .dw small{font-size:11px;color:var(--muted);background:var(--paper);border-radius:6px;padding:2px 6px}
html.bigtext #app{zoom:1.14}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media(max-width:420px){.hero{grid-template-columns:104px 1fr}.hero .arc{width:104px;height:104px}.hero .arc .n{font-size:24px}.hero h1{font-size:22px}.shline{font-size:24px}}
</style>

  function cands(w){const c=[w];if(IRREGULAR[w])c.push(IRREGULAR[w]);if(w.endsWith("'s"))c.push(w.slice(0,-2));if(w.endsWith('ies')&&w.length>4)c.push(w.slice(0,-3)+'y');if(w.endsWith('es')&&w.length>3)c.push(w.slice(0,-2));if(w.endsWith('s')&&w.length>2)c.push(w.slice(0,-1));if(w.endsWith('ied')&&w.length>4)c.push(w.slice(0,-3)+'y');if(w.endsWith('ed')&&w.length>3){c.push(w.slice(0,-2));c.push(w.slice(0,-1));if(w[w.length-3]===w[w.length-4])c.push(w.slice(0,-3));}if(w.endsWith('ing')&&w.length>4){c.push(w.slice(0,-3));c.push(w.slice(0,-3)+'e');if(w[w.length-4]===w[w.length-5])c.push(w.slice(0,-4));}if(w.endsWith('er')&&w.length>3){c.push(w.slice(0,-2));c.push(w.slice(0,-1));if(w[w.length-3]===w[w.length-4])c.push(w.slice(0,-3));}if(w.endsWith('est')&&w.length>4){c.push(w.slice(0,-3));c.push(w.slice(0,-2));if(w[w.length-4]===w[w.length-5])c.push(w.slice(0,-4));}if(w.endsWith('ier')&&w.length>4)c.push(w.slice(0,-3)+'y');if(w.endsWith('iest')&&w.length>5)c.push(w.slice(0,-4)+'y');if(w.endsWith('ly')&&w.length>3){c.push(w.slice(0,-2));if(w.endsWith('ily'))c.push(w.slice(0,-3)+'y');}return c;}
  function lookup(tok,g){const w=clean(tok);if(!w||/^\d+$/.test(w))return null;for(const k of cands(w))if(g[k]!==undefined)return{key:k,uz:g[k]};return null;}
  return{lookup,clean,isName:t=>NAMES.has(clean(t))};

const API=(CFG.apiBase||'')+'/.netlify/functions';
const BOT=CFG.bot||'InglizTili0danBot';
const LS='b25_progress';
let P=load();
function load(){try{return Object.assign({code:'',uid:'',name:'',tg:'',openDay:null,units:{},shadow:{},test:null,dirty:false,seen:{}},JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){return{code:'',uid:'',name:'',tg:'',openDay:null,units:{},shadow:{},test:null,dirty:false,seen:{}};}}
function save(){try{localStorage.setItem(LS,JSON.stringify(P));}catch(e){}}
const $=s=>document.querySelector(s); const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
const DEMO=()=>location.hash.includes('demo')||P.uid==='demo';
const openDay=()=>location.hash.includes('all')||P.uid==='master'?25:(P.openDay||CFG.openDay||1);
function unitScore(id){const u=P.units[id];return u?u.score:null;}
function unitDone(id){return (unitScore(id)||0)>=CFG.passScore;}
function dayStatus(d){const ids=d.units.map(u=>u.id);const done=ids.filter(unitDone).length;const sh=!!P.shadow[d.day];const tst=d.test?(P.test&&P.test.score>=CFG.testPass):true;const total=ids.length+1+(d.test?1:0);const got=done+(sh?1:0)+(d.test&&tst?1:0);return{st:got===total?'done':got>0?'part':'',got,total};}
function courseProgress(){let t=0,g=0;DAYS.forEach(d=>{d.units.forEach(u=>{t++;if(unitDone(u.id))g++;});t++;if(P.shadow[d.day])g++;if(d.test){t++;if(P.test&&P.test.score>=CFG.testPass)g++;}});return{t,g};}

/* ===== Server sync (best effort) ===== */
async function verifyCode(code){const r=await fetch(`${API}/verify?code=${encodeURIComponent(code)}`,{cache:'no-store'});return r.json();}
async function sync(){if(!P.code||DEMO())return;P.dirty=true;save();if(!navigator.onLine)return;try{const r=await fetch(`${API}/progress`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:P.code,name:P.name,units:P.units,shadow:P.shadow,test:P.test})});const j=await r.json();if(j.ok){P.dirty=false;P.syncedAt=Date.now();save();}}catch(e){}}
async function refreshOpenDay(){if(!P.code||DEMO()||!navigator.onLine)return;try{const j=await verifyCode(P.code);if(j.ok&&j.openDay){if(P.openDay!==j.openDay){P.openDay=j.openDay;save();if(location.hash==='#home'||!location.hash)viewHome();}}}catch(e){}}
window.addEventListener('online',()=>{if(P.dirty)sync();});

/* ===== TTS ===== */
/* Names the English voice would mangle → how to say them (display text is never changed) */
const SAY={'Usmat':'Oosmat','Jizzax':'Jizzakh','Bekzod':'Bekzod','Dilnoza':'Dilnoza','Nodira':'Nodeera','Hamida':'Hameeda','Aziz':'Azeez','Malika':'Maleeka','Karim':'Kareem','Samarkand':'Samarkand','Tashkent':'Tashkent','Tom':'Tom','Kim':'Kim','Bukhara':'Bukhara'};
const sayText=t=>String(t).replace(/\b(Usmat|Jizzax|Nodira|Hamida|Aziz|Malika|Karim)('s)?\b/g,(m,n,ps)=>SAY[n]+(ps||''));
const TTS={voice:null,voices:[],ready:false,
  init(){if(!('speechSynthesis'in window))return;const pick=()=>{const vs=speechSynthesis.getVoices();if(!vs.length)return;this.voices=vs.filter(v=>/^en[-_]/i.test(v.lang));this.ready=true;const want=P.voice&&vs.find(v=>v.name===P.voice);
    this.voice=want||this.voices.find(v=>/en[-_]GB/i.test(v.lang)&&/Google UK English Female/i.test(v.name))||this.voices.find(v=>/en[-_]GB/i.test(v.lang)&&/female|Kate|Serena|Stephanie|Libby|Sonia/i.test(v.name))||this.voices.find(v=>/en[-_]US/i.test(v.lang)&&/Google US English|Samantha|Zira|Aria|Jenny/i.test(v.name))||this.voices.find(v=>/en[-_]GB/i.test(v.lang))||this.voices[0]||null;};
    pick();speechSynthesis.onvoiceschanged=pick;setTimeout(pick,300);setTimeout(pick,1500);},
  // Robust speak: keeps a reference (iOS GC bug), resumes paused engine (Chrome), and never hangs if onend is lost.
  speak(text,rate=0.9,opts){return new Promise(res=>{if(!('speechSynthesis'in window)){toast('Bu qurilmada ovoz yoʻq');return res();}
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(opts&&opts.raw?text:sayText(text));if(opts&&opts.onb)u.onboundary=opts.onb;u.lang=(this.voice&&this.voice.lang)||'en-GB';if(this.voice)u.voice=this.voice;u.rate=rate;u.pitch=1;u.volume=1;
    let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);this._u=null;res();};u.onend=fin;u.onerror=fin;
    const est=Math.max(1200,(text.length*75)/rate+900);const t=setTimeout(fin,est+2500);
    this._u=u;try{speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){fin();}});},
  stop(){if('speechSynthesis'in window){try{speechSynthesis.cancel();}catch(e){}}this._u=null;}};
TTS.init();
// Unlock speech on first touch (iOS / Android require a user gesture before audio plays)
document.addEventListener('touchend',function unlock(){if(!('speechSynthesis'in window))return;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);speechSynthesis.cancel();}catch(e){}document.removeEventListener('touchend',unlock);},{once:true});
const SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function spkBtn(text,rate){return `<button class="spk" data-say="${esc(text)}" data-rate="${rate||0.9}" aria-label="Tinglash">${SPK}</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(!b)return;document.querySelectorAll('.spk.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');TTS.speak(b.dataset.say,parseFloat(b.dataset.rate)).then(()=>b.classList.remove('on'));});

/* ===== Router, back button, Esc ===== */
// Every go() pushes a hash → the phone's back button / browser back goes exactly one step.
// At the home screen a back press is caught once ("press again to exit") so the app doesn't close by accident.
let exitArmed=false;
function go(h){if(location.hash==='#'+h){route();return;}location.hash=h;}
function back(fallback){if(history.state&&history.state.b25>0)history.back();else go(fallback||'home');}
window.addEventListener('hashchange',()=>{if(!(history.state&&history.state.b25!=null)){const prev=(history.state&&history.state.b25)||0;history.replaceState({b25:prev+1},'');}route();});
window.addEventListener('popstate',e=>{if(e.state&&e.state.root){if(exitArmed){return;}exitArmed=true;setTimeout(()=>exitArmed=false,2000);history.pushState({b25:0},'','#home');toast('Chiqish uchun yana bir marta «orqaga» bosing');route();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const pop=document.querySelector('.pop');if(pop){pop.remove();return;}if(location.hash&&location.hash!=='#home'&&location.hash!=='#start')back();}});
function initHistory(){const h=location.hash||'#home';history.replaceState({root:1},'','#home');history.pushState({b25:0},'',h);}
function route(){TTS.stop();document.querySelectorAll('.pop').forEach(p=>p.remove());const h=location.hash.replace('#','').replace(/^(all|demo)\/?/,'');const [k,a,b]=h.split('/');window.scrollTo(0,0);
  if(!P.code&&!DEMO())return k==='install'?viewInstall():viewStart();
  if(k==='start'&&P.code)return go('home');
  if(k==='day')return viewDay(+a);
  if(k==='unit')return viewUnit(+a,b||'rule');
  if(k==='shadow')return viewShadow(+a);
  if(k==='test')return viewTest(+a);
  if(k==='profile')return viewProfile();
  if(k==='install')return viewInstall();
  if(k==='ustoz')return viewUstoz();
  if(!sessionStorage.getItem('b25_ustoz')&&k!=='start'){return viewUstoz(true);}
  return viewHome();}
function topbar(back_,title){return `<div class="top">${back_?`<button class="back" onclick="back('${back_}')">‹ Orqaga</button>`:`<img src="${EMBLEM}" alt=""><div class="brand">${esc(CFG.courseName)}<small>Imamov Academy</small></div>`}<div class="sp"></div>${title?`<span class="pill">${esc(title)}</span>`:''}${back_?'':`<button class="iconbtn" onclick="go('profile')" aria-label="Profil">👤</button>`}</div><div class="curve"></div>`;}
function foot(){return `<div class="foot"><img src="${EMBLEM}" alt="">Imamov Academy · ${esc(CFG.telegram)} · ${esc(CFG.phone)}</div>`;}
function render(html){app.innerHTML=`<div class="view">${html}</div>`;}

render(`<div class="login"><div class="logo"><img src="${EMBLEM}" alt="Imamov Academy"><h1>${esc(CFG.courseName)}</h1><p>Ingliz tili — 0 dan, 25 kunda. Imamov Academy.</p></div>
<div class="card"><input class="codein" id="code" placeholder="B25-XXXXX" value="${esc(pre)}" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" onkeydown="if(event.key==='Enter')login()"><div class="err" id="err"></div><button class="btn wide" id="loginbtn" onclick="login()">Kirish</button>

<div id="loginInstall">${installBlock(true)}</div></div>`);

async function login(){const inp=$('#code'),err=$('#err'),btn=$('#loginbtn');let code=inp.value.trim().toUpperCase().replace(/\s+/g,'');if(code&&!code.startsWith('B25-')&&/^[A-Z2-9]{5}$/.test(code))code='B25-'+code;if(!code){err.textContent='Kodni kiriting';return;}

${installCard()}
<div class="days">${DAYS.map(d=>{const {st,got,total}=dayStatus(d);const locked=d.day>od;const n=d.units.length;const sub=n?`${n} ta dars (Unit ${d.units[0].id}${n>1?'–'+d.units[n-1].id:''}) · shadowing`:'40 ta savol · shadowing';return `<button class="day ${st} ${locked?'locked':''} ${nextDay&&nextDay.day===d.day?'next':''}" ${locked?'disabled':''} onclick="go('day/${d.day}')"><span class="num">${d.day}</span><span><span class="t">${esc(d.title)}</span><span class="s">${esc(sub)}</span>${!locked&&got?`<span class="mini"><i style="width:${got/total*100}%"></i></span>`:''}</span><span class="st">${locked?'🔒':st==='done'?'✅':'›'}</span></button>`;}).join('')}</div>${foot()}`);}

let EX=null;
function viewUnit(id,tab){const u=UNITS[id];if(!u)return go('home');if(u.day>openDay())return go('home');
const tabs=[['rule','Qoida'],['words','Soʻzlar'],['text','Matn'],['ex','Mashqlar']];
const done=unitDone(id);P.seen[id]=P.seen[id]||{};P.seen[id][tab]=true;save();
render(`${topbar('day/'+u.day,'Unit '+id)}<h2 class="sec">${esc(u.title)}</h2><p class="sub">Day ${u.day} · ${u.code==='G'?'Grammatika':'Soʻz va koʻnikma'} ${done?'· <b style="color:var(--ok)">tugallandi ✓</b>':''}</p>
<div class="tabs">${tabs.map(([k,l],i)=>`<button class="${k===tab?'on':''} ${(k==='ex'?done:P.seen[id][k])?'seen':''}" onclick="go('unit/${id}/${k}')"><b>${(k==='ex'?done:P.seen[id][k])&&k!==tab?'✓':i+1}</b>${l}</button>`).join('')}</div><div id="pane"></div>${foot()}`);
const pane=$('#pane');
if(tab==='rule'){pane.innerHTML=`<div class="card"><div class="rule">${md(u.rule)}</div></div><div class="card">${u.examples.map(e=>`<div class="ex"><span class="en">${esc(e)}</span>${spkBtn(e,0.85)}</div>`).join('')}</div><button class="btn wide" onclick="go('unit/${id}/words')">Soʻzlarga oʻtish ›</button>`;}
else if(tab==='words'){pane.innerHTML=`<p class="note">Kartochkani bosing — tarjima koʻrinadi. Ovoz tugmasi bilan tinglang.</p><div class="words">${u.words.map(w=>`<button class="word" onclick="this.querySelector('.uz').classList.toggle('hide')"><span class="en">${esc(w.en)}</span><span class="uz hide">${esc(w.uz)}</span>${spkBtn(w.en,0.85)}</button>`).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn ghost" onclick="document.querySelectorAll('.word .uz').forEach(x=>x.classList.remove('hide'))">Hammasini ochish</button><button class="btn" onclick="go('unit/${id}/text')">Matnga oʻtish ›</button></div>`;}
else if(tab==='text'){pane.innerHTML=`<div class="card"><div class="toolbar"><strong style="font-family:var(--serif);font-size:18px">${esc(u.text.title||'Matn')}</strong><span class="sp" style="flex:1"></span>${spkBtn(u.text.en.replace(/\n/g,' '),0.85)}</div><div class="text" id="txt">${renderText(u.text.en)}</div><p class="note">Soʻzga bossangiz tarjimasi chiqadi va oʻqib beradi.</p></div><button class="btn wide" onclick="go('unit/${id}/ex')">Mashqlarga oʻtish ›</button>`;bindText();}
else{renderEx(u);}}
function renderText(t){const lines=t.split('\n');return lines.map(line=>{const m=line.match(/^([A-Z][a-z]+(?: [A-Z][a-z]+)?):\s*(.*)$/);let pre='',body=line;if(m){pre=`<span class="spkr">${esc(m[1])}:</span> `;body=m[2];}
const toks=body.split(/(\s+)/);return pre+toks.map(tk=>{if(/^\s+$/.test(tk)||!tk)return tk;const c=Lexicon.clean(tk);if(!c||Lexicon.isName(tk)||/^\d+$/.test(c))return `<span class="nw">${esc(tk)}</span>`;return `<span class="w" data-w="${esc(tk)}">${esc(tk)}</span>`;}).join('');}).join('<br>');}
function bindText(){const box=$('#txt');let pop=null;const close=()=>{if(pop){pop.remove();pop=null;}box.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));};
box.addEventListener('click',e=>{const w=e.target.closest('.w');if(!w){close();return;}close();w.classList.add('on');
const tok=w.dataset.w;let hit=null;const next=w.nextElementSibling;const nxt=next&&next.classList.contains('w')?next.dataset.w:null;
if(nxt){const key=(Lexicon.clean(tok)+' '+Lexicon.clean(nxt));if(G[key]){hit={key,uz:G[key],phrase:true};}}
if(!hit)hit=Lexicon.lookup(tok,G);
pop=document.createElement('div');pop.className='pop';const shown=Lexicon.clean(tok);
pop.innerHTML=hit?`<b>${esc(hit.phrase?hit.key:shown)}</b>${hit.uz?esc(hit.uz):''}${!hit.phrase&&hit.key!==shown?`<div class="ph">asosi: ${esc(hit.key)}</div>`:''}`:`<b>${esc(shown)}</b><span class="ph">tarjima topilmadi</span>`;
document.body.appendChild(pop);const r=w.getBoundingClientRect();const pw=pop.offsetWidth;let left=r.left+window.scrollX+r.width/2-pw/2;left=Math.max(8,Math.min(left,window.innerWidth-pw-8));pop.style.left=left+'px';pop.style.top=(r.bottom+window.scrollY+8)+'px';
TTS.speak(hit&&hit.phrase?hit.key:shown,0.85);});
document.addEventListener('click',e=>{if(!e.target.closest('#txt')&&!e.target.closest('.pop'))close();});}

/* ===== Exercises ===== */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#1E9BE6','#0B3FAF','#F2B134','#22C55E','#ffffff'];const ps=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));let t=0;(function f(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});if(++t<90)requestAnimationFrame(f);else c.remove();})();}

 ok(){this.tone(880,0,0.12);this.tone(1320,0.09,0.18);},

 const spans=[...box.querySelectorAll('.w,.nw')];if(!spans.length)return;let text='',starts=[];spans.forEach(s=>{starts.push(text.length);text+=s.textContent+' ';});

viewUnit=function(id,tab){_viewUnit(id,tab);if(tab==='text'){const tb=document.querySelector('#pane .card .toolbar');if(tb)tb.insertAdjacentHTML('afterend',`<button class="btn ghost" id="rabtn" style="margin-bottom:10px" onclick="readAlong()">▶ Soʻzma-soʻz oʻqish</button>`);}};
const _route=route;
route=function(){const h=location.hash.replace('#','').replace(/^(all|demo)\/?/,'');const [k,a]=h.split('/');
 if(P.code||DEMO()){if(k==='reyting')return (TTS.stop(),window.scrollTo(0,0),viewLeaderboard());if(k==='takror')return (TTS.stop(),window.scrollTo(0,0),viewReview());if(k==='lugat')return (TTS.stop(),window.scrollTo(0,0),viewDict());if(k==='nishon')return (window.scrollTo(0,0),viewBadges());if(k==='sertifikat')return (window.scrollTo(0,0),viewCert(+a||25));}
 return _route();};
sync=async function(){if(!P.code||DEMO())return;P.dirty=true;save();if(!navigator.onLine)return;
 try{const r=await fetch(`${API}/progress`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:P.code,name:P.name,units:P.units,shadow:P.shadow,test:P.test,badges:P.badges||[],streak:streak(),srsCorrect:P.srsCorrect||0,seconds:P.seconds||0})});const j=await r.json();if(j.ok){P.dirty=false;P.syncedAt=Date.now();save();}}catch(e){}};
// streak should also count review days
const _streak=streak;
streak=function(){const days=new Set();Object.values(P.units).forEach(u=>{if(u.at)days.add(new Date(u.at).toDateString());});Object.values(P.shadowAt||{}).forEach(t=>days.add(new Date(t).toDateString()));Object.keys(P.time||{}).forEach(k=>{if((P.time[k]||0)>=300)days.add(new Date(k+'T12:00:00').toDateString());});
 let n=0;const d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1);}return n;};

/* ===== Boot ===== */
applyPrefs();initHistory();route();refreshOpenDay();setTimeout(()=>{const sp=$('#splash');if(sp){sp.classList.add('off');setTimeout(()=>sp.remove(),500);}},isStandalone()?650:350);if(P.dirty)sync();setTimeout(checkBadges,1500);
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}

</script>
